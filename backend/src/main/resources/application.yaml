spring:
  application:
    name: spendlog
  datasource:
    url: jdbc:h2:file:./spendlog-data;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  web:
    error:
      include-message: always
      include-stacktrace: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  # 혼자 쓰는 로컬 앱이므로 이 컴퓨터에서만 접속할 수 있게 합니다.
  address: 127.0.0.1
  port: 8080
