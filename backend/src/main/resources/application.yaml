spring:
  application:
    name: spendlog
  datasource:
    url: jdbc:h2:file:./spendlog-data;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  error:
    include-message: always
