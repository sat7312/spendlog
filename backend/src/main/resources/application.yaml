spring:
  application:
    name: spendlog
  datasource:
    # 배포 환경에서는 SPRING_DATASOURCE_URL/USERNAME/PASSWORD 환경변수로 Postgres를 지정합니다.
    url: jdbc:h2:file:./spendlog-data;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  web:
    error:
      include-message: always
      include-stacktrace: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${PORT:8080}
app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    # 32바이트 이상. 비워 두면 실행할 때마다 임의 키를 만들어 재시작 시 로그인이 풀립니다.
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
